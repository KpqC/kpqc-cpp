name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Check out test vectors
        uses: actions/checkout@v7
        with:
          repository: KpqC/kpqc-test-vectors
          ref: d75490bf824faa4b148cd0b901a2eb13198fe0da
          path: kpqc-test-vectors
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DKPQC_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        env:
          KPQC_TEST_VECTORS: ${{ github.workspace }}/kpqc-test-vectors
        run: ctest --test-dir build --output-on-failure
      - name: Install
        run: cmake --install build --prefix "${{ runner.temp }}/kpqc"
      - name: Configure installed-package consumer
        run: >-
          cmake -S tests/consumer -B consumer-build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="${{ runner.temp }}/kpqc"
      - name: Build installed-package consumer
        run: cmake --build consumer-build --parallel
      - name: Test installed-package consumer
        run: ctest --test-dir consumer-build --output-on-failure

  big-endian:
    name: Linux s390x (big-endian)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Check out test vectors
        uses: actions/checkout@v7
        with:
          repository: KpqC/kpqc-test-vectors
          ref: d75490bf824faa4b148cd0b901a2eb13198fe0da
          path: kpqc-test-vectors
      - name: Set up s390x emulation
        uses: docker/setup-qemu-action@v4
        with:
          platforms: s390x
      - name: Build and test on s390x
        run: >-
          docker run --rm --platform linux/s390x
          -e KPQC_TEST_VECTORS=/workspace/kpqc-test-vectors
          -v "${{ github.workspace }}:/workspace:ro"
          -w /workspace
          ubuntu:24.04
          bash -c 'apt-get update &&
          DEBIAN_FRONTEND=noninteractive apt-get install -y
          --no-install-recommends build-essential cmake ca-certificates &&
          cmake -S . -B /tmp/kpqc-build
          -DCMAKE_BUILD_TYPE=Release -DKPQC_BUILD_TESTS=ON &&
          cmake --build /tmp/kpqc-build --parallel 2 &&
          ctest --test-dir /tmp/kpqc-build --output-on-failure'

  sanitizers:
    name: Linux sanitizers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v7
      - name: Check out test vectors
        uses: actions/checkout@v7
        with:
          repository: KpqC/kpqc-test-vectors
          ref: d75490bf824faa4b148cd0b901a2eb13198fe0da
          path: kpqc-test-vectors
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DKPQC_BUILD_TESTS=ON
          "-DCMAKE_C_FLAGS=-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined"
          "-DCMAKE_CXX_FLAGS=-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        env:
          KPQC_TEST_VECTORS: ${{ github.workspace }}/kpqc-test-vectors
        run: ctest --test-dir build --output-on-failure
