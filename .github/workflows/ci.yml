name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Check out KAT vectors
        uses: actions/checkout@v4
        with:
          repository: KpqC/kpqc-test-vectors
          ref: 179dcc05ece2e22262cea1a61f3cdf1a5b08a304
          path: kpqc-test-vectors
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DKPQC_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        env:
          KPQC_TEST_VECTORS: ${{ github.workspace }}/kpqc-test-vectors
        run: ctest --test-dir build --output-on-failure
      - name: Install
        run: cmake --install build --prefix "${{ runner.temp }}/kpqc"
