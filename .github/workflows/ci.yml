name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DKPQC_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test API behavior
        run: ctest --test-dir build --output-on-failure -R '^api$'
      - name: Install
        run: cmake --install build --prefix "${{ runner.temp }}/kpqc"
